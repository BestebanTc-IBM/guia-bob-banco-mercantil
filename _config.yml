title: "Guía IBM Bob — Banco Mercantil"
description: "Guía práctica de adopción de IBM Bob para desarrolladores del core bancario"
theme: jekyll-theme-cayman

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - codigo/
